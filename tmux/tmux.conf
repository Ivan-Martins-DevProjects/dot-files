# --- Configuração Geral ---
set -g prefix C-s
unbind C-b
bind C-s send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Navegação entre Painéis ---
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# --- Atalhos Customizados (Sem prefixo) ---
bind-key C-t split-window -v -p 30
unbind C-x
bind-key C-x new-window
unbind C-z
bind-key C-z kill-window

# Navegar entre janelas com Alt + 1..6
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6

unbind-key c
bind-key c command-prompt -p "Window name:" "new-window -n '%%'"

# --- Aparência e Barra de Status ---
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 50
set -g status-bg colour235
set -g status-fg colour244

# Lado Esquerdo
set -g status-left '#[fg=colour15,bg=colour26,bold] #S #[fg=colour26,bg=colour235,nobold]'

# Janelas
set -g window-status-current-format '#[fg=colour235,bg=colour33]#[fg=colour15,bg=colour33,noreverse,bold] #I  #W #[fg=colour33,bg=colour235]'
set -g window-status-format '#[fg=colour244,bg=colour235] #I  #W '
set -g window-status-separator ' '

# Lado Direito (Corrigido o erro de sintaxe)
set -g status-right '#[fg=colour15,bg=colour235] %H:%M  %d/%m/%Y '

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Configurações do Resurrect
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Inicialização do TPM (Mantenha sempre no final do arquivo)
run '~/.tmux/plugins/tpm/tpm'
